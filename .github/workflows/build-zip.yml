name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the project (newest zip, or a folder that holds it)
        run: |
          best=""; bestt=0
          while IFS= read -r z; do
            t=$(git log -1 --format=%ct -- "$z")
            if [ "${t:-0}" -ge "$bestt" ]; then bestt="${t:-0}"; best="$z"; fi
          done < <(find . -name "*.zip" -not -path "./.git/*")
          if [ -n "$best" ]; then
            echo "Using zip: $best"
            mkdir /tmp/x && unzip -oq "$best" -d /tmp/x
            s=$(find /tmp/x -name settings.gradle.kts | head -1)
            if [ -z "$s" ]; then echo "No settings.gradle.kts inside the zip"; find /tmp/x | head -40; exit 1; fi
            cp -a "$(dirname "$s")"/. .
          else
            echo "No zip found, looking for the project inside the repo"
            s=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
            if [ -z "$s" ]; then echo "No project found. Repo contents:"; find . -not -path "./.git/*" | head -40; exit 1; fi
            d=$(dirname "$s")
            if [ "$d" != "." ]; then cp -a "$d"/. .; fi
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -E "^e: |What went wrong" -A3 build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: PlutoSaturn-from-zip-apk
          path: app/build/outputs/apk/debug/*.apk
